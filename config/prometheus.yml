# SentinelFlow Prometheus Configuration
#
# Consumed by the compose `prometheus` service (profile: monitoring).
# Scrape targets use compose DNS names on the sentinelflow-network.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'sentinelflow'

rule_files:
  - 'prometheus_alerts.yml'

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # SentinelFlow API metrics (compose service: api, port 8000)
  - job_name: 'sentinelflow-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s