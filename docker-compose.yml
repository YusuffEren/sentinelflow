# SentinelFlow - Real-Time Financial Fraud Detection System
# Docker Compose Configuration - Enterprise Grade
# -----------------------------------------------------
# Usage: docker compose up -d
# Verify: docker compose ps
# Logs: docker compose logs -f

services:
  # =============================================================================
  # POSTGRESQL - Primary Database for Alerts, Cases, Audit
  # =============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: sentinelflow-postgres
    hostname: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sentinelflow
      POSTGRES_PASSWORD: sentinelflow_secret
      POSTGRES_DB: sentinelflow
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - sentinelflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelflow -d sentinelflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # =============================================================================
  # ZOOKEEPER - Kafka Coordination Service
  # =============================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: sentinelflow-zookeeper
    hostname: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    networks:
      - sentinelflow-network
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # =============================================================================
  # KAFKA - Distributed Event Streaming Platform
  # =============================================================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: sentinelflow-kafka
    hostname: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_MESSAGE_MAX_BYTES: 10485760
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - sentinelflow-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # =============================================================================
  # KAFKA-UI - Web UI for Kafka Cluster Monitoring
  # =============================================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: sentinelflow-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: sentinelflow-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - sentinelflow-network
    restart: unless-stopped

  # =============================================================================
  # NEO4J - Graph Database for Relationship & Ring Detection
  # =============================================================================
  neo4j:
    image: neo4j:5.15.0-community
    container_name: sentinelflow-neo4j
    hostname: neo4j
    ports:
      - "7474:7474"  # HTTP Browser
      - "7687:7687"  # Bolt Protocol
    environment:
      NEO4J_AUTH: neo4j/sentinelflow_secret_2024
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_memory_pagecache_size: 512M
      NEO4J_dbms_memory_heap_initial__size: 512M
      NEO4J_dbms_memory_heap_max__size: 1G
      NEO4J_dbms_security_procedures_unrestricted: apoc.*,gds.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*,gds.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    networks:
      - sentinelflow-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # =============================================================================
  # REDIS - In-Memory Cache & Geo-Spatial Operations
  # =============================================================================
  redis:
    image: redis:7.2-alpine
    container_name: sentinelflow-redis
    hostname: redis
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
    volumes:
      - redis_data:/data
    networks:
      - sentinelflow-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # =============================================================================
  # REDIS COMMANDER - Web UI for Redis
  # =============================================================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: sentinelflow-redis-commander
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
    networks:
      - sentinelflow-network
    restart: unless-stopped

  # =============================================================================
  # PROMETHEUS - Metrics Collection (Optional)
  # =============================================================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: sentinelflow-prometheus
    hostname: prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - sentinelflow-network
    restart: unless-stopped
    profiles:
      - monitoring

  # =============================================================================
  # SENTINELFLOW API - FastAPI Backend
  # =============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinelflow-api
    hostname: api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: sentinelflow
      POSTGRES_PASSWORD: sentinelflow_secret
      POSTGRES_DB: sentinelflow
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: sentinelflow_secret_2024
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      JWT_ALGORITHM: HS256
    networks:
      - sentinelflow-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/system/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # =============================================================================
  # SENTINELFLOW FRONTEND - Next.js Web Application
  # =============================================================================
  frontend:
    build:
      context: ./sentinelflow-web
      dockerfile: Dockerfile
    container_name: sentinelflow-frontend
    hostname: frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
    networks:
      - sentinelflow-network
    restart: unless-stopped
    profiles:
      - frontend

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  sentinelflow-network:
    driver: bridge
    name: sentinelflow-network

# =============================================================================
# VOLUMES - Persistent Data Storage
# =============================================================================
volumes:
  postgres_data:
    name: sentinelflow-postgres-data
  zookeeper_data:
    name: sentinelflow-zookeeper-data
  zookeeper_logs:
    name: sentinelflow-zookeeper-logs
  kafka_data:
    name: sentinelflow-kafka-data
  neo4j_data:
    name: sentinelflow-neo4j-data
  neo4j_logs:
    name: sentinelflow-neo4j-logs
  neo4j_plugins:
    name: sentinelflow-neo4j-plugins
  redis_data:
    name: sentinelflow-redis-data
  prometheus_data:
    name: sentinelflow-prometheus-data
